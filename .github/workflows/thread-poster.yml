name: Thread poster

on:
  schedule:
    # Daily, 17:00 UTC ≈ 1pm US Eastern
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual post)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: poster
  cancel-in-progress: false

jobs:
  thread:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Post thread
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python automation/post_thread.py --dry-run
          else
            python automation/post_thread.py
          fi
      - name: Save queue state
        run: |
          git config user.name "forummapping-bot"
          git config user.email "forummapping-bot@users.noreply.github.com"
          git add -A threads/
          git commit -m "thread posted $(date -u +%F)" || echo "nothing to commit"
          # three attempts, then give up quietly — the next run carries the state.
          # every branch ends in `true` so bookkeeping can never fail the job.
          for attempt in 1 2 3; do
            if git fetch origin main && git rebase origin/main && git push; then
              echo "state pushed on attempt $attempt"; break
            fi
            git rebase --abort 2>/dev/null || true
            echo "attempt $attempt lost the race; retrying"
            sleep 5
          done
          true
