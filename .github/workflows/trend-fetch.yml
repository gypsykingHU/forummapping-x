name: Trend fetch

on:
  schedule:
    # Every 2 hours, worldwide only. Milan's call: responsive enough for
    # political/economic/finance/geography trends without the cost of hourly
    # or a second (US) location.
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Fetch trends
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python automation/fetch_trends.py
      - name: Save trends
        run: |
          git config user.name "forummapping-bot"
          git config user.email "forummapping-bot@users.noreply.github.com"
          git add trends_raw/ trend_candidates.json trend_candidates_seen.json
          git commit -m "trends $(date -u +%F_%H:%M)" || echo "nothing to commit"
          # three attempts, then give up quietly — the next run carries the state.
          # every branch ends in `true` so bookkeeping can never fail the job.
          for attempt in 1 2 3; do
            if git fetch origin main && git rebase origin/main && git push; then
              echo "state pushed on attempt $attempt"; break
            fi
            git rebase --abort 2>/dev/null || true
            echo "attempt $attempt lost the race; retrying"
            sleep 5
          done
          true
