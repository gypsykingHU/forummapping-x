name: Newsletter

on:
  schedule:
    # Weekly, Monday 15:00 UTC ≈ 11am US Eastern
    - cron: '0 15 * * 1'      # Mondays 15:00 UTC — weekly, per Plan A
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual send)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Send newsletter
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python automation/send_newsletter.py --dry-run
          else
            python automation/send_newsletter.py
          fi
      - name: Save queue state
        run: |
          git config user.name "forummapping-bot"
          git config user.email "forummapping-bot@users.noreply.github.com"
          git add -A newsletter/
          git commit -m "newsletter sent $(date -u +%F)" || echo "nothing to commit"
          # three attempts, then give up quietly — the next run carries the state.
          # every branch ends in `true` so bookkeeping can never fail the job.
          for attempt in 1 2 3; do
            if git fetch origin main && git rebase origin/main && git push; then
              echo "state pushed on attempt $attempt"; break
            fi
            git rebase --abort 2>/dev/null || true
            echo "attempt $attempt lost the race; retrying"
            sleep 5
          done
          true
