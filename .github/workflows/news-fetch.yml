name: News fetch

on:
  schedule:
    # 05:30 UTC on days divisible by 3 — hours before the digest writer runs
    - cron: '30 5 * * 1'      # Monday early — feeds that day's newsletter research
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python automation/fetch_news.py
      - name: Save news
        run: |
          git config user.name "forummapping-bot"
          git config user.email "forummapping-bot@users.noreply.github.com"
          git add news_raw/
          git commit -m "news fetch $(date -u +%F)" || echo "nothing to commit"
          # three attempts, then give up quietly — the next run carries the state.
          # every branch ends in `true` so bookkeeping can never fail the job.
          for attempt in 1 2 3; do
            if git fetch origin main && git rebase origin/main && git push; then
              echo "state pushed on attempt $attempt"; break
            fi
            git rebase --abort 2>/dev/null || true
            echo "attempt $attempt lost the race; retrying"
            sleep 5
          done
          true
