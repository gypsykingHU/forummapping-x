name: News fetch

on:
  schedule:
    # 05:30 UTC on days divisible by 3 — hours before the digest writer runs
    - cron: '30 5 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python automation/fetch_news.py
      - name: Save news
        run: |
          git config user.name "forummapping-bot"
          git config user.email "forummapping-bot@users.noreply.github.com"
          git add news_raw/
          git commit -m "news fetch $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase
          git push
