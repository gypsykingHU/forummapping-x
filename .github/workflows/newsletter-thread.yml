name: Newsletter thread

on:
  schedule:
    # ~36h after the Monday newsletter
    - cron: '0 3 * * 3'       # Wednesday 03:00 UTC ≈ 36h after the Monday send
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual post)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: poster
  cancel-in-progress: false

jobs:
  thread:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Post newsletter thread
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python automation/post_newsletter_thread.py --dry-run
          else
            python automation/post_newsletter_thread.py
          fi
      - name: Save state
        run: |
          git config user.name "forummapping-bot"
          git config user.email "forummapping-bot@users.noreply.github.com"
          mkdir -p state newsletter_threads
          git add -A state/ newsletter_threads/ || true
          git commit -m "newsletter thread $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase
          git push
