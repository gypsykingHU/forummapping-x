name: Article poster

# NOTE: schedule disabled — X Articles are now published via the browser-based
# scheduled task "forummapping-x-articles" (real Articles composer, Premium+).
# This workflow remains as a manual long-post fallback: Actions -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual post)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: poster
  cancel-in-progress: false

jobs:
  article:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Post article
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python automation/post_article.py --dry-run
          else
            python automation/post_article.py
          fi
      - name: Save state
        run: |
          git config user.name "forummapping-bot"
          git config user.email "forummapping-bot@users.noreply.github.com"
          mkdir -p state
          git add -A state/ || true
          git commit -m "article posted $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase
          git push
