name: Weekly report

on:
  schedule:
    # Sunday 18:00 UTC
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Build report
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python automation/weekly_report.py
      - name: Save report
        run: |
          git config user.name "forummapping-bot"
          git config user.email "forummapping-bot@users.noreply.github.com"
          git add -A reports/ content_database.csv
          git commit -m "weekly report $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase
          git push
