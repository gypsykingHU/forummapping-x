name: Hourly pulse (facts + maps)

on:
  schedule:
    - cron: '5 * * * *'   # every hour
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual posts)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: poster
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Post fact (hourly) + map (even hours)
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAG="--dry-run"; fi
          python automation/post_fact.py $FLAG
          # Map posts ride along on even hours (12/day) instead of running their own
          # workflow — one checkout of this 500MB repo instead of two.
          if [ $(( $(date -u +%H) % 2 )) -eq 0 ]; then
            sleep 60   # offset from the fact so the two don't land in the same minute
            python automation/post_to_x.py $FLAG
          fi
      - name: Save state
        run: |
          git config user.name "forummapping-bot"
          git config user.email "forummapping-bot@users.noreply.github.com"
          mkdir -p state
          git add facts.csv state/ || true
          git commit -m "pulse $(date -u +%F_%H:%M)" || echo "nothing to commit"
          git pull --rebase
          git push
