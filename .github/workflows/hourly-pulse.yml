name: Hourly pulse (facts)

on:
  schedule:
    - cron: '5 * * * *'   # every hour
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual posts)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: poster
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Post fact + news
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAG="--dry-run"; fi
          python automation/post_fact.py $FLAG
      - name: Save state
        run: |
          git config user.name "forummapping-bot"
          git config user.email "forummapping-bot@users.noreply.github.com"
          mkdir -p state
          git add facts.csv state/ || true
          git commit -m "pulse $(date -u +%F_%H:%M)" || echo "nothing to commit"
          git pull --rebase
          git push
