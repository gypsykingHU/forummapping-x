name: Facts (hourly)

on:
  schedule:
    - cron: '5 * * * *'   # every hour
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual posts)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: poster
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Post fact
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          set -o pipefail
          FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAG="--dry-run"; fi
          mkdir -p logs
          # tee everything so a failure leaves evidence in the repo, not just in
          # the Actions UI (which needs auth to read)
          python automation/post_fact.py $FLAG 2>&1 | tee -a /tmp/pulse.out
      - name: Record outcome
        if: always()
        run: |
          mkdir -p logs
          {
            echo "=== $(date -u +%FT%TZ)  run ${{ github.run_number }}  status=${{ job.status }}"
            tail -n 25 /tmp/pulse.out 2>/dev/null || echo "(no output captured)"
            echo ""
          } >> logs/failures.log
          # keep the file from growing without bound
          tail -n 400 logs/failures.log > logs/.t && mv logs/.t logs/failures.log

      - name: Save state
        if: always()
        run: |
          git config user.name "forummapping-bot"
          git config user.email "forummapping-bot@users.noreply.github.com"
          mkdir -p state
          git add facts.csv state/ logs/ || true
          git commit -m "pulse $(date -u +%F_%H:%M)" || echo "nothing to commit"
          # three attempts, then give up quietly — the next run carries the state.
          # every branch ends in `true` so bookkeeping can never fail the job.
          for attempt in 1 2 3; do
            if git fetch origin main && git rebase origin/main && git push; then
              echo "state pushed on attempt $attempt"; break
            fi
            git rebase --abort 2>/dev/null || true
            echo "attempt $attempt lost the race; retrying"
            sleep 5
          done
          true
