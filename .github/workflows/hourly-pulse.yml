name: Hourly pulse (facts + maps)

on:
  schedule:
    - cron: '5 * * * *'   # every hour
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual posts)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: poster
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Post fact (hourly) + map (every 4h)
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAG="--dry-run"; fi
          python automation/post_fact.py $FLAG
          # Maps ride along on every pulse. The script itself enforces the ~4h
          # spacing from the LAST MAP POST, so it works no matter which triggers
          # GitHub actually fires. Gating on the clock hour meant maps only posted
          # when a run happened to land on 00/04/08/12/16/20 — about 25% of runs.
          sleep 45   # brief offset so fact and map don't land in the same minute
          python automation/post_to_x.py $FLAG
      - name: Save state
        run: |
          git config user.name "forummapping-bot"
          git config user.email "forummapping-bot@users.noreply.github.com"
          mkdir -p state
          git add facts.csv state/ || true
          git commit -m "pulse $(date -u +%F_%H:%M)" || echo "nothing to commit"
          git fetch origin main
          git rebase origin/main || git rebase --abort
          git push || (sleep 5 && git fetch origin main && git rebase origin/main && git push) || \
            echo "push lost the race; next run will carry these changes"
