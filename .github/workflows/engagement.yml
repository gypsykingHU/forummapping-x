name: Engagement

on:
  schedule:
    # Daily at 14:15 UTC ≈ 10:15am US Eastern
    - cron: '15 14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no comments/follows)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  engage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Comment and follow
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python automation/engage.py --dry-run
          else
            python automation/engage.py
          fi
      - name: Save state
        run: |
          git config user.name "forummapping-bot"
          git config user.email "forummapping-bot@users.noreply.github.com"
          git add -A state/
          git commit -m "engagement $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase
          git push
