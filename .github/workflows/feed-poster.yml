name: Maps (every 4h)

on:
  schedule:
    # Every 4 hours = 6 map posts/day. Spacing is the cron's job, not the code's.
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual post)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Post to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          # lets post_to_x.py record each claim straight to origin/main via the
          # Contents API, instead of relying on the git step at the end of the job
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python automation/post_to_x.py --dry-run
          else
            python automation/post_to_x.py
          fi

      - name: Save posting log
        if: always()
        run: |
          git config user.name "forummapping-bot"
          git config user.email "forummapping-bot@users.noreply.github.com"
          # content_database.csv is NOT committed here any more. post_to_x.py
          # claims each map_id directly on origin/main through the Contents API
          # before the post goes out, so the 7-day lock no longer depends on
          # this step surviving. Losing this step now costs a log line, not a
          # posting record — which is what let two maps repeat.
          git checkout -- content_database.csv 2>/dev/null || true
          git add logs/ state/ 2>/dev/null || true
          git commit -m "logs $(date -u +%F_%H:%M)" || echo "nothing to commit"
          # three attempts, then give up quietly — the next run carries the state.
          # every branch ends in `true` so bookkeeping can never fail the job.
          for attempt in 1 2 3; do
            if git fetch origin main && git rebase origin/main && git push; then
              echo "state pushed on attempt $attempt"; break
            fi
            git rebase --abort 2>/dev/null || true
            echo "attempt $attempt lost the race; retrying"
            sleep 5
          done
          true
